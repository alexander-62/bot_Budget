<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Web App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg-start: #f5eee1;
      --bg-end: #dce7f2;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text: #1f2a33;
      --muted: #61707c;
      --shadow: 0 20px 50px rgba(39, 58, 74, 0.16);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.7), transparent 34%),
        linear-gradient(155deg, var(--bg-start), var(--bg-end));
    }

    .card {
      width: min(100%, 720px);
      padding: 22px;
      border-radius: var(--radius);
      background: var(--card-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.05;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .logo-box {
      overflow: hidden;
      border-radius: 20px;
      background: #eef3f7;
      border: 1px solid rgba(31, 42, 51, 0.08);
    }

    .logo-box img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      max-height: 72vh;
      margin: 0 auto;
    }

    .meta {
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Budget Web App</h1>
    <p>Тестовая страница, чтобы посмотреть, как мини-приложение выглядит на телефоне и на компьютере.</p>

    <section class="logo-box">
      <img src="/webapp/static/logo.png" alt="Budget logo">
    </section>

    <div id="meta" class="meta">Загрузка параметров Telegram...</div>
  </main>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    const meta = document.getElementById("meta");

    if (tg) {
      tg.ready();
      tg.expand();
      meta.textContent =
        `platform: ${tg.platform || "unknown"} | ` +
        `viewport: ${Math.round(tg.viewportHeight || window.innerHeight)}px | ` +
        `colorScheme: ${tg.colorScheme || "unknown"}`;
    } else {
      meta.textContent = `Открыто вне Telegram. Размер окна: ${window.innerWidth}x${window.innerHeight}`;
    }
  </script>
</body>
</html>
