name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv --system-site-packages .venv
          call bot.bat ui --help
      - run: python scripts/run_tests.py
        env:
          BOT_BUDGET_UI_SCREENSHOT: artifacts/windows-panel.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-panel-preview
          path: artifacts/windows-panel.png
          if-no-files-found: ignore
